<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>IronBuddy: Workout Tracker on Google Play</title>
<meta http-equiv="refresh" content="2; url=https://play.google.com/store/apps/details?id=com.ironbuddy.app&amp;referrer=utm_source%3Dinstagram%26utm_medium%3Dbio%26utm_campaign%3Dbio">
<style>body{margin:0;background:#0A0E14;color:#AAB2BE;font:16px Poppins,system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center}a{color:#A6E62E}</style>
</head>
<body>
<p>Opening Google Play&hellip; <a href="https://play.google.com/store/apps/details?id=com.ironbuddy.app&amp;referrer=utm_source%3Dinstagram%26utm_medium%3Dbio%26utm_campaign%3Dbio">Tap here if nothing happens</a></p>
<script data-goatcounter="https://ironbuddy.goatcounter.com/count" data-goatcounter-settings='{"no_onload":true}' async src="//gc.zgo.at/count.js"></script>
<script>
(function () {
  var target = "https://play.google.com/store/apps/details?id=com.ironbuddy.app&referrer=utm_source%3Dinstagram%26utm_medium%3Dbio%26utm_campaign%3Dbio";
  var done = false;
  function go() { if (!done) { done = true; location.replace(target); } }
  function count() {
    if (window.goatcounter && window.goatcounter.count) {
      window.goatcounter.count({ event: true, path: "bio-play", title: "Instagram bio to Google Play" });
      setTimeout(go, 250);
    }
  }
  var s = document.querySelector("script[data-goatcounter]");
  if (window.goatcounter && window.goatcounter.count) count(); else s.addEventListener("load", count);
  setTimeout(go, 1500);
})();
</script>
</body>
</html>
